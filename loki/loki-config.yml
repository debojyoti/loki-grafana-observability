auth_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_address: 0.0.0.0
  grpc_listen_port: 9096
  log_level: info
  grpc_server_max_concurrent_streams: 1000

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index-cache
    cache_ttl: 24h
  aws:
    endpoint: ${DO_SPACES_ENDPOINT}
    region: ${DO_SPACES_REGION}
    bucketnames: ${DO_SPACES_BUCKET}
    access_key_id: ${DO_SPACES_ACCESS_KEY}
    secret_access_key: ${DO_SPACES_SECRET_KEY}
    insecure: false
    s3forcepathstyle: false

ingester:
  wal:
    enabled: true
    dir: /loki/wal
  chunk_encoding: snappy
  chunk_idle_period: 30m
  max_chunk_age: 2h
  chunk_target_size: 1572864

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 10
  delete_request_store: s3

limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD}
  max_query_lookback: ${LOKI_RETENTION_PERIOD}
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_strategy: local
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 6
  per_stream_rate_limit: 2MB
  per_stream_rate_limit_burst: 4MB
  max_line_size: 256KB
  max_line_size_truncate: false
  allow_structured_metadata: true
  volume_enabled: true

query_range:
  align_queries_with_step: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 64

frontend:
  encoding: protobuf
  compress_responses: true

analytics:
  reporting_enabled: false

